<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d3a; background: linear-gradient(135deg, rgba(255,214,232,.25), rgba(201,228,255,.25)); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body.running { background: #fff; }
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20; }

  /* Laptop 1: one big emoji on white. */
  #emoji { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; font-size: min(62vh, 50vw); line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  body.describe #emoji { display: flex; }

  /* Pictures: laptop 1's reveal, laptop 2's guesses. Cross-fade between them. */
  #picture { position: fixed; inset: 0; }
  #picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.2s; }
  #picture img.show { opacity: 1; }
  body.revealed #emoji { display: none; }

  /* Laptop 2: the emojis it has read, most recent on the right. */
  #trail { position: fixed; left: 24px; right: 24px; bottom: 18px; text-align: right; white-space: nowrap; overflow: hidden; font-size: 22px; letter-spacing: 4px; direction: rtl; }
  #trail span { direction: ltr; unicode-bidi: isolate; }

  #status { position: fixed; left: 0; right: 0; top: 48px; text-align: center; color: #888; font-size: 16px; }
  #problem { position: fixed; left: 10%; right: 10%; top: 74px; text-align: center; color: #c0392b; font-size: 14px; }

  /* The webcam feed is only read, never shown. Kept rendering (not display:none) so frames keep decoding. */
  #video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #start.hide { display: none; }
  #card { padding: 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  #card h1 { margin: 0; color: #000; font-size: 32px; font-weight: 500; }
  #card p { margin: -10px 0 32px; color: #000; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font: inherit; padding: 12px 24px; border: 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.4); color: #1d1d3a; box-shadow: 0 1px 4px rgba(40,30,80,.08), 0 0 0 1px rgba(255,255,255,.45), inset 0 1px 0 rgba(255,255,255,.6); }
  #nokey { color: #c0392b; display: none; }
</style>
</head>
<body>
<div id="drag" data-tauri-drag-region></div>
<div id="picture"></div>
<div id="emoji"></div>
<div id="trail"></div>
<div id="status"></div>
<div id="problem"></div>

<video id="video" playsinline muted></video>

<div id="start">
  <div id="card">
    <h1>First Contact</h1>
    <p>by whack_a_snake</p>
    <div class="row">
      <button id="startA">Describe my world</button>
      <button id="startB">Guess their world</button>
    </div>
    <div id="nokey">No ANTHROPIC_API_KEY found in .env</div>
    <p style="margin: 8px 0 0; color: #666; font-size: 13px;">Space ends a run</p>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
