<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d3a; background: linear-gradient(135deg, rgba(255,214,232,.25), rgba(201,228,255,.25)); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body.running { background: #fff; }
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20; }

  /* Laptop 1: the field (ending with the finish flag planted in it), then the reveal. */
  #field { display: none; position: fixed; inset: 0; width: 100%; height: 100%; }
  body.send #field { display: block; }

  /* The reveal (laptop 1) and the guess (laptop 2) share a layout: the words, then each field. */
  .result { display: none; position: fixed; inset: 0; background: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 60px 40px 40px; }
  body.revealed #reveal, body.read #guess { display: flex; }
  .sentence { font-size: 46px; font-weight: 600; text-align: center; color: #111; max-width: 90%; }
  .sentence .unknown { color: #ccc; }
  /* A word that a later field changed: it flashes green, with the old guess crossed out above it. */
  .sentence .word { position: relative; display: inline-block; }
  .sentence .revised { animation: revised 4.5s ease-out both; }
  .sentence .was { position: absolute; left: 50%; bottom: 88%; transform: translateX(-50%); font-size: 22px; font-weight: 500; color: #c0392b; text-decoration: line-through; white-space: nowrap; animation: was 4.5s ease-in both; }
  @keyframes revised { 0%, 55% { color: #0a9a5c; } 100% { color: #111; } }
  @keyframes was { 0%, 60% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
  .thought { margin-top: -26px; color: #888; font-style: italic; font-size: 16px; min-height: 22px; }
  .tiles { --tw: 200px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 95%; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 20px; color: #333; animation: pop .5s both; animation-delay: calc(var(--i, 0) * 140ms); }
  .tile canvas, .tile img { width: var(--tw); height: calc(var(--tw) * .625); object-fit: cover; border-radius: 10px; box-shadow: 0 3px 14px rgba(0,0,0,.18); background: #0c1d14; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }

  .pill { position: fixed; left: 50%; transform: translateX(-50%); padding: 5px 14px; border-radius: 999px; background: rgba(255,255,255,.88); white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; z-index: 5; }
  .pill:empty { display: none; }
  #status { top: 46px; color: #555; font-size: 16px; }
  #problem { top: 82px; color: #c0392b; font-size: 14px; }

  /* The webcam feed is only read, never shown. Kept rendering (not display:none) so frames keep decoding. */
  #video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #start.hide { display: none; }
  #card { padding: 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  #card h1 { margin: 0; color: #000; font-size: 32px; font-weight: 500; }
  #card p { margin: -8px 0 14px; color: #000; }
  .row { display: flex; gap: 10px; align-items: center; }
  button, input { font: inherit; padding: 11px 18px; border: 0; border-radius: 12px; color: #1d1d3a; background: rgba(255,255,255,.4); box-shadow: 0 1px 4px rgba(40,30,80,.08), 0 0 0 1px rgba(255,255,255,.45), inset 0 1px 0 rgba(255,255,255,.6); }
  button { cursor: pointer; }
  input { width: 260px; outline: none; user-select: text; -webkit-user-select: text; background: rgba(255,255,255,.65); }
  .hint { color: #666; font-size: 13px; }
  #nokey { color: #c0392b; display: none; }
</style>
</head>
<body>
<div id="drag" data-tauri-drag-region></div>

<canvas id="field"></canvas>

<div id="reveal" class="result">
  <div class="sentence" id="revealSentence"></div>
  <div class="tiles" id="revealTiles"></div>
</div>

<div id="guess" class="result">
  <div class="sentence" id="guessSentence"></div>
  <div class="thought" id="guessThought"></div>
  <div class="tiles" id="guessTiles"></div>
</div>

<div id="status" class="pill"></div>
<div id="problem" class="pill"></div>

<video id="video" playsinline muted></video>

<div id="start">
  <div id="card">
    <h1>First Contact</h1>
    <p>crop circles, by whack_a_snake</p>
    <div class="row">
      <input id="sentence" placeholder="We come in peace" maxlength="140" autocomplete="off" spellcheck="false">
      <button id="startA">Send</button>
    </div>
    <button id="startB">Read their message</button>
    <div class="hint">Space ends a run</div>
    <div id="nokey">No ANTHROPIC_API_KEY found in .env</div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
