<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d3a; background: linear-gradient(135deg, var(--bg1, rgba(255,214,232,.25)), var(--bg2, rgba(201,228,255,.25))); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  .surface { display: none; position: fixed; top: 40px; bottom: 8px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(40,30,80,.10), 0 0 0 1px rgba(255,255,255,.3); }
  body.describe #stage, body.guess #stage, body.guess #imagined, body.guess #cam { display: block; }
  #stage { left: 8px; right: 8px; }
  #stage canvas, #imagined canvas { display: block; }
  .bubble { position: absolute; max-width: min(60%, 520px); padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,.92); color: #1d1d3a; font-size: 26px; line-height: 1.25; white-space: pre-wrap; pointer-events: none; transition: opacity .3s; box-shadow: 0 4px 18px rgba(40,30,80,.15), 0 0 0 1px rgba(255,255,255,.5); }
  .bubble::after { content: ""; position: absolute; top: 100%; left: var(--tail, 50%); width: 18px; height: 12px; margin-left: -9px; background: inherit; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  body.raised .bubble { opacity: 0; }
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20; }
  body.guess #stage { right: calc(50% + 4px); }
  #imagined { left: calc(50% + 4px); right: 8px; }

  .title { font-size: 40px; font-weight: 500; }

  #cam { position: fixed; left: 16px; bottom: 16px; width: 340px; display: none; z-index: 5; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(40,30,80,.10), 0 0 0 1px rgba(255,255,255,.3); }
  #cam video { width: 100%; display: block; transform: scaleX(-1); }
  #cam .frame { position: relative; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
  #preview { display: none; }

  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #start.hide { display: none; }
  #card { padding: 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  #card h1 { margin: 0; color: #000; }
  #card p { margin: -10px 0 32px; color: #000; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font: inherit; padding: 12px 24px; border: 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.4); color: #1d1d3a; box-shadow: 0 1px 4px rgba(40,30,80,.08), 0 0 0 1px rgba(255,255,255,.45), inset 0 1px 0 rgba(255,255,255,.6); }
  #nokey { color: #c0392b; display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="drag" data-tauri-drag-region></div>
<div id="stage" class="surface"></div>
<div id="imagined" class="surface"></div>

<div id="cam">
  <div class="frame">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" width="320" height="180"></canvas>
  </div>
  <canvas id="preview" width="160" height="90"></canvas>
</div>

<div id="start">
  <div id="card">
    <h1 class="title">First Contact</h1>
    <p>by whack_a_snake</p>
    <div class="row">
      <button id="startA">Describe my world</button>
      <button id="startB">Guess their world</button>
    </div>
    <div id="nokey">No ANTHROPIC_API_KEY found in .env</div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
