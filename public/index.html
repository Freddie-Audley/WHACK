<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Contact</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="First Contact">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  * { box-sizing: border-box; }
  /* No pinch or double-tap zoom on phones; nothing here scrolls, so panning is all touch needs to do. On every
     element, not just the root: iPhone Safari zooms on a double tap on the board's frame or the gaps otherwise. */
  * { touch-action: pan-x pan-y; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d3a; background: linear-gradient(135deg, var(--bg1, rgba(255,214,232,.25)), var(--bg2, rgba(201,228,255,.25))); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  .surface { display: none; position: fixed; top: 40px; bottom: 8px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(40,30,80,.10), 0 0 0 1px rgba(255,255,255,.3); }
  body.describe #stage, body.guess #stage, body.guess #imagined, body.guess #cam { display: block; }
  #stage { left: 8px; right: 8px; }
  #stage canvas, #imagined canvas { display: block; }
  /* The ambassador's speech bubble. scene.js fits --fs to the stage (see placeBubble). */
  .bubble { position: absolute; left: 0; top: 0; max-width: min(62%, 540px); padding: 12px 18px 13px; border-radius: 22px; background: linear-gradient(#fff, #f5f2ff); color: #1d1d3a; font-size: var(--fs, 26px); font-weight: 500; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty; pointer-events: none; transition: opacity .3s; transform-origin: var(--tail, 50%) 100%; box-shadow: 0 8px 26px rgba(40,30,80,.18), 0 1px 3px rgba(40,30,80,.08), inset 0 1px 0 #fff, 0 0 0 1.5px rgba(120,100,200,.16); }
  .bubble.pop { animation: bubble-in .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(.94); } }
  /* The tail: a rounded diamond tucked half under the bubble's bottom edge, pointing at the head. */
  .bubble::after { content: ""; position: absolute; bottom: -7px; left: var(--tail, 50%); width: 15px; height: 15px; background: #f5f2ff; border-radius: 0 0 4px 0; transform: translateX(-50%) rotate(45deg); box-shadow: 1.5px 1.5px 0 rgba(120,100,200,.16), 4px 4px 8px rgba(40,30,80,.08); }
  .bubble.over::after { display: none; } /* squeezed down onto the head, so no tail */
  body.raised .bubble { opacity: 0; }
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20; }
  body.guess #stage { right: calc(50% + 4px); }
  #imagined { left: calc(50% + 4px); right: 8px; }
  /* Contact from Earth: the board and its tools over Earth. --board is the board's width; the magenta frame
     (5% of it) is what the guesser's webcam looks for, so nothing else near the board may be magenta. */
  #editor { --board: min(68vw, calc(100vh - 190px), 680px); display: none; position: fixed; inset: 40px 8px 8px; z-index: 5; align-items: center; flex-direction: column; gap: 12px; }
  body.earth #stage { display: block; }
  body.earth #editor { display: flex; }
  .editor-main { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  #pixel-board-frame { grid-column: 2; grid-row: 1; width: var(--board); aspect-ratio: 1; overflow: hidden; border: calc(var(--board) * .05) solid #ff00ff; padding: 2px; border-radius: 6px; background: #fff; box-shadow: 0 8px 30px rgba(40,30,80,.25); }
  /* Wipe: one animation down and back up (the board is cleared while it is out of sight). */
  body.earth.down #pixel-board-frame { animation: dip .5s ease-in-out; }
  @keyframes dip { 0%, 100% { transform: none; } 25%, 75% { transform: translateY(100vh); } }
  #pixel-board { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .editor-tools { grid-column: 3; grid-row: 1; justify-self: start; margin-left: 20px; display: grid; grid-template-columns: repeat(2, 68px); gap: 10px; }
  /* The selected tool is the solid one, with a dark ring. */
  #editor .square-button { width: 68px; height: 68px; padding: 0; display: grid; place-items: center; touch-action: manipulation; }
  #editor .square-button[aria-pressed="true"] { --back: rgba(255,255,255,.95); box-shadow: 0 0 0 2px #1d1d3a, 0 6px 20px rgba(40,30,80,.12); }
  /* Colour buttons: a round swatch inset in the button. */
  #editor .pen { --m: 10px; background: radial-gradient(circle closest-side, var(--ink) calc(100% - var(--m) - .5px), var(--back) calc(100% - var(--m))); }
  /* Wipe sits with the tools, as wide as two of them. */
  #editor #wipe { grid-column: span 2; width: auto; }
  #pen-black { --ink: #111; }
  #pen-white { --ink: #fff; }
  .editor-tools img { width: 42px; height: 42px; object-fit: contain; }

  .title { font-size: 40px; font-weight: 500; }

  #cam { position: fixed; left: 16px; bottom: 16px; width: 340px; display: none; z-index: 5; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(40,30,80,.10), 0 0 0 1px rgba(255,255,255,.3); }
  #cam video { width: 100%; display: block; transform: scaleX(-1); }
  #cam .frame { position: relative; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
  #preview { display: none; }
  #seen { display: none; position: absolute; top: 50%; left: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,.92); color: #1d1d3a; font-size: 52px; font-weight: 600; line-height: 84px; text-align: center; box-shadow: 0 2px 10px rgba(40,30,80,.25); }
  body.read #seen { display: block; } /* only once a still board has been accepted and handed to the model */
  /* The board as read off the webcam (what the model is given), beside the webcam while a board is in view. */
  #processed { position: fixed; left: 364px; bottom: 16px; height: 191px; display: none; z-index: 5; border-radius: 12px; background: #fff; box-shadow: 0 4px 18px rgba(40,30,80,.10), 0 0 0 1px rgba(255,255,255,.3); }
  body.spotted #processed[src] { display: block; }

  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #start.hide { display: none; }
  /* The card fills the start window (520 by 505, see shrinkWindow; 560 while building a world) top to bottom, so the UFO stays put whatever is
     shown under the title; on a taller window it floats in the middle. */
  #card { min-height: 100%; padding: 0 20px 52px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  /* The title is on a sign the UFO in the snake's scene holds up (snake.js), which lines it up with this; the space
     above is for the UFO, the padding below for the key hints. */
  #card h1 { margin: 132px 0 36px; color: transparent; }
  /* Until the code has loaded (three.js comes from a CDN) the buttons would do nothing, so they wait; without a
     key the two that need one stay greyed out. */
  #choices { display: flex; flex-direction: column; gap: 8px; width: max-content; visibility: hidden; } /* all as wide as the widest */
  body.ready #choices { visibility: visible; }
  body:not(.key) #startA, body:not(.key) #startB { opacity: .4; pointer-events: none; }
  #card { max-height: 100vh; overflow-y: auto; }
  #make-world { width: 100%; }
  /* Build your world: in place of the choices once Make your own new world is pressed. One row per category, its
     options a pill-shaped segmented control (the chosen segments white, as macOS does it); Back and Start below. */
  #world-picker { display: none; width: min(480px, calc(100vw - 40px)); margin-top: 14px; text-align: left; visibility: hidden; }
  body.building #choices { display: none; }
  body.building #world-picker { display: block; }
  body.ready #world-picker { visibility: visible; }
  /* The names make one column, as wide as the longest, so every control starts on the same line. */
  #world-categories { display: grid; grid-template-columns: max-content 1fr; column-gap: 10px; row-gap: 6px; }
  .category { display: grid; grid-template-columns: subgrid; grid-column: span 2; align-items: center; }
  .category .name { font-size: 13px; font-weight: 500; }
  .chips { display: flex; padding: 3px; border-radius: 999px; background: rgba(29,29,58,.07); box-shadow: inset 0 0 0 .5px rgba(29,29,58,.05); }
  .chip { position: relative; flex: 1 1 auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 16px; text-align: center; white-space: nowrap; color: #1d1d3a; transition: background .15s, box-shadow .15s; }
  .chip:hover { background: rgba(255,255,255,.4); }
  .chip:has(input:checked) { background: #fff; box-shadow: 0 1px 3px rgba(40,30,80,.18), 0 0 0 .5px rgba(40,30,80,.06); }
  .chip:has(input:focus-visible) { outline: 2px solid #5b4ab8; outline-offset: 1px; }
  .chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; }
  .picker-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .picker-buttons button { padding: 6px 16px; font-size: 13px; }
  #snakes { position: fixed; inset: 0; z-index: -1; }
  /* Every button in the app: a liquid-glass pill (or circle, when square), like the panels. */
  button { --back: rgba(255,255,255,.45); font: inherit; font-size: 15px; font-weight: 500; padding: 9px 20px; border: 0; border-radius: 999px; cursor: default; color: #1d1d3a; background: var(--back); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(40,30,80,.10), inset 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.2); transition: background .15s, transform .15s, box-shadow .15s; }
  button:hover { --back: rgba(255,255,255,.65); }
  button:active { --back: rgba(255,255,255,.8); transform: scale(.97); box-shadow: 0 2px 8px rgba(40,30,80,.10), inset 0 0 0 1px rgba(255,255,255,.7); }
  /* The keyboard shortcuts: under the choices on the menu, and centred in the title bar while a
     role is on (clicking one does the same as the key). Bare text, no panel behind it, so it reads as a label
     rather than another button. Desktop only (phones skip the menu, and have no keys anyway). */
  #keys { position: fixed; bottom: 17px; left: 50%; transform: translateX(-50%); z-index: 21; display: flex; gap: 18px; white-space: nowrap; font-size: 13px; font-weight: 500; color: #1d1d3a; visibility: hidden; }
  body.ready #keys { visibility: visible; }
  body.describe #keys, body.guess #keys, body.earth #keys { top: 9px; bottom: auto; } /* centred in the title bar, level with the traffic lights */
  #keys kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-right: 6px; padding: 0 5px; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; color: #1d1d3a; background: #fff; box-shadow: 0 1px 0 1px rgba(40,30,80,.15); }
  @media (pointer: coarse) { #keys { display: none; } }
  #nokey { margin-top: 12px; color: #c0392b; display: none; }
  #game-error { position: fixed; left: 50%; bottom: 20px; z-index: 30; width: min(560px, calc(100vw - 32px)); padding: 14px 18px; border-radius: 12px; transform: translateX(-50%); background: #fff; color: #9c2c22; box-shadow: 0 4px 18px rgba(40,30,80,.2); text-align: center; }
  @media (max-width: 620px) {
    #editor { --board: min(calc(100vw - 32px), calc(100vh - 260px), 680px); }
    .editor-main { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    #pixel-board-frame { flex: 0 0 auto; }
    .editor-tools { grid-template-columns: repeat(4, 56px) 80px; gap: 8px; margin-left: 0; }
    #editor #wipe { grid-column: auto; width: 80px; }
    #editor .square-button { width: 56px; height: 56px; }
    #editor .pen { --m: 8px; }
    .editor-tools img { width: 32px; height: 32px; }
  }
  @media (max-height: 600px) {
    #editor { --board: min(64vw, calc(100vh - 160px), 680px); }
  }
  @media (max-width: 620px) and (max-height: 600px) {
    #editor { --board: min(calc(100vw - 32px), calc(100vh - 230px), 680px); }
  }
  /* Phones: Earth fills the whole screen; the board and its buttons stay clear of the status bar and home bar. */
  @media (pointer: coarse) {
    /* iOS home-screen apps report a screen shorter by the status bar, which left a white strip at the bottom. */
    body.earth #stage { inset: 0 0 auto; height: calc(100% + env(safe-area-inset-top)); border-radius: 0; box-shadow: none; }
    #editor { inset: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px); }
    #pixel-board-frame { border-radius: 14px; }
    /* Just the board and Clear: a touch on a black pixel rubs out, anywhere else draws. */
    #editor { --board: min(calc(100vw - 32px), calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 100px), 680px); }
    #editor .pen, #editor #brush-tool, #editor #fill-tool { display: none; } /* #editor: outranks #editor .square-button */
    .editor-tools { display: block; }
    #editor #wipe { width: auto; height: 48px; padding: 0 32px; margin-top: 16px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="drag" data-tauri-drag-region></div>
<div id="keys">
  <span id="key-reset"><kbd>R</kbd>Reset</span>
  <span id="key-menu"><kbd>B</kbd>Back to menu</span>
  <span id="key-quit"><kbd>Q</kbd>Quit</span>
</div>
<div id="stage" class="surface"></div>
<div id="imagined" class="surface"></div>
<main id="editor" aria-label="Pixel editor">
  <div class="editor-main">
    <div id="pixel-board-frame">
      <canvas id="pixel-board" width="640" height="640" aria-label="12 by 12 pixel whiteboard. Draw with the selected color."></canvas>
    </div>
    <div class="editor-tools" aria-label="Pixel editor tools">
      <button id="pen-black" class="square-button pen" type="button" aria-label="Black pixels" aria-pressed="true"></button>
      <button id="pen-white" class="square-button pen" type="button" aria-label="White pixels" aria-pressed="false"></button>
      <button id="brush-tool" class="square-button" type="button" aria-label="Brush" aria-pressed="true">
        <img src="resources/paint_brush.png" alt="">
      </button>
      <button id="fill-tool" class="square-button" type="button" aria-label="Fill area" aria-pressed="false">
        <img src="resources/paint_bucket.svg" alt="">
      </button>
      <button id="wipe" class="square-button" type="button">Wipe</button>
    </div>
  </div>
</main>

<div id="cam">
  <div class="frame">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" width="320" height="180"></canvas>
    <div id="seen" aria-label="Board spotted">✓</div>
  </div>
  <canvas id="preview" width="160" height="90"></canvas>
</div>
<img id="processed" alt="What the agent sees">
<div id="game-error" role="alert" hidden></div>

<div id="start">
  <div id="card">
    <h1 class="title">First Contact</h1>
    <div id="choices">
      <button id="startA">Be the alien</button>
      <button id="startB">Be the listener</button>
      <button id="startE">Be Earth</button>
      <button id="make-world" type="button">Make your own new world</button>
    </div>
    <section id="world-picker" aria-label="Build your world">
      <div id="world-categories"></div>
      <div class="picker-buttons">
        <button id="world-back" type="button">Back</button>
        <button id="world-start" type="button">Start as the alien</button>
      </div>
    </section>
    <div id="nokey">No ANTHROPIC_API_KEY found in .env</div>
  </div>
</div>
<script type="module" src="snake.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
